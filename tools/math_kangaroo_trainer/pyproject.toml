[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "math-kangaroo-trainer"
version = "0.1.0"
description = "Offline, versioned corpus-audit foundation for the Spatial Gym Math Kangaroo trainer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14,<2",
  "numpy>=2,<3",
  "pydantic>=2.13,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
]

[project.scripts]
math-kangaroo-trainer = "math_kangaroo_trainer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/math_kangaroo_trainer"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/synthetic"]
